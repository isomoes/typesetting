name: Deploy Docs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Add permissions block here
permissions:
  contents: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to GitHub Pages
        # Docsify renders these static files in the browser; no CLI build is needed.
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          clean: true
